name: Using expressions

on:
  workflow_dispatch:
    inputs:
      debug:
        description: Print workflow start-up data
        type: boolean
        default: false

jobs:
  echo:
    runs-on: ubuntu-latest
    steps:
      - name: '[Debug] Print start-up data'
        if: ${{ inputs.debug }}
        run: |
          echo "Trigger by: ${{ github.event_name }}"
          echo "Branch: ${{ github.ref_name }}"
      - name: '[Debug] Debugging disabled'
        if: ${{ !inputs.debug }}
        run: echo "Debug mode is disabled"